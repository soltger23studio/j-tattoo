name: Wiki-figyelő

# Hetente újrafuttatja a pet-importot a wiki ellen. Ha változott valami
# (új pet, átnevezés, módosult bónusz vagy ár), nyit egy pull requestet a
# frissített adattal. Ha nincs változás, nem csinál semmit – nincs zaj.
#
# A lib/pet-overrides.ts-hez SOHA nem nyúl, tehát a kézzel beírt adatok
# (Item Shop, küldetés) egy ilyen frissítést is túlélnek.

on:
  schedule:
    # Minden hétfő 06:00 UTC
    - cron: '0 6 * * 1'
  # Kézzel is indítható a repo Actions fülén
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-figyelo
  cancel-in-progress: false

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A mostani pet-nevek, hogy utána össze tudjuk hasonlítani
      - name: Jelenlegi lista elmentése
        run: node scripts/pet-nevek.mjs > /tmp/regi-nevek.txt

      - name: Adatok leszedése a wikiről
        run: node scripts/fetch-wiki-pets.mjs

      - name: lib/pets.ts és a képek újragenerálása
        run: node scripts/import-pets.mjs ./wiki-pets.json

      - name: Változás keresése és a PR-szöveg összeállítása
        id: valtozas
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- lib/pets.ts public/images/pets)" ]; then
            echo 'valtozott=false' >> "$GITHUB_OUTPUT"
            echo 'A wiki adatai változatlanok – nincs teendő.'
            exit 0
          fi
          echo 'valtozott=true' >> "$GITHUB_OUTPUT"

          node scripts/pet-nevek.mjs > /tmp/uj-nevek.txt

          # A PR törzsét fájlba írjuk, nem shell-változóba: a pet-nevek a
          # wikiről jönnek, azokat nem interpoláljuk parancsba.
          {
            echo 'A heti wiki-figyelő változást talált a szerver wikijén, és'
            echo 'újragenerálta a `lib/pets.ts`-t meg a képeket.'
            echo
            comm -13 /tmp/regi-nevek.txt /tmp/uj-nevek.txt | sed 's/^/- **Új pet:** /'
            comm -23 /tmp/regi-nevek.txt /tmp/uj-nevek.txt | sed 's/^/- **Eltűnt a wikiről:** /'
            echo
            echo 'Ha a fenti lista üres, a pet-készlet ugyanaz maradt, csak valamelyik'
            echo 'adat változott (bónusz, ár, ikon vagy megszerzési mód) – a diffből'
            echo 'látszik, pontosan mi.'
            echo
            echo 'A `lib/pet-overrides.ts`-hez ez a futás nem nyúlt, tehát a kézzel'
            echo 'beírt adatok megmaradtak.'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/pr-torzs.md

          echo '--- A PR törzse ---'
          cat /tmp/pr-torzs.md

      - name: Pull request nyitása
        if: steps.valtozas.outputs.valtozott == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALAP_AG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          AG="wiki-frissites/$(date -u +%Y-%m-%d)"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$AG"
          git add lib/pets.ts public/images/pets
          git commit -m 'Pet-adatok frissítése a wikiről'
          git push -u origin "$AG" --force

          # Ha ma már nyílt PR erről az ágról, csak frissítettük – ne nyissunk másikat.
          if [ -n "$(gh pr list --head "$AG" --state open --json number --jq '.[].number')" ]; then
            echo 'Már van nyitott PR erről az ágról, csak a commitot toltam fel.'
            exit 0
          fi

          gh pr create \
            --base "$ALAP_AG" \
            --head "$AG" \
            --title 'Pet-adatok frissítése a wikiről' \
            --body-file /tmp/pr-torzs.md
